name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  parity:
    # Proves the seven-field Compliance Receipt is byte-identical across the Python and
    # Node reference implementations, against a pinned golden receipt_ref.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Python package + build Node package
        run: |
          python -m pip install ./python
          cd typescript && npm ci && npm run build
      - name: Python parity (pinned golden)
        run: python tests/test_parity.py
      - name: Node parity (same golden, byte-identical to Python)
        run: node tests/parity.mjs
